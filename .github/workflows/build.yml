name: Build mod
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - name: Unzip project
        run: |
          n=$(ls *.zip | wc -l)
          if [ "$n" -ne 1 ]; then echo "У сховищі має бути рівно один zip, а зараз: $n"; ls *.zip; exit 1; fi
          unzip -q *.zip
      - name: Build
        run: |
          d=$(dirname "$(find . -name build.gradle | head -1)")
          cd "$d"
          gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: "*/build/libs/*.jar"
